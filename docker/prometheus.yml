global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'neural-agent-api'
    static_configs:
      - targets: ['api-server:8000']
    metrics_path: '/metrics'

  - job_name: 'neural-agent-worker'
    static_configs:
      - targets: ['agent-worker:8001']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']

  - job_name: 'milvus'
    static_configs:
      - targets: ['milvus-standalone:9091']